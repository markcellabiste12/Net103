<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Router Automation Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #e8eaf4;
      color: #1f2d4d;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 28px 32px 32px;
      box-shadow: 0 4px 16px rgba(31, 45, 77, .12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      font-weight: 700;
      color: #1f2d4d;
    }
    .target {
      margin: 0 0 16px;
      color: #333;
    }
    .target code {
      font-family: Consolas, "Courier New", monospace;
      color: #222;
    }
    button.run {
      background: #0b63c5;
      color: #fff;
      border: 0;
      border-radius: 5px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.run:hover { background: #0a54a8; }
    button.run:disabled { background: #6c9bd1; cursor: wait; }
    .status {
      margin-left: 12px;
      font-size: .9rem;
      color: #555;
    }
    h2 {
      margin: 28px 0 14px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #1f2d4d;
    }
    .alert {
      margin-top: 20px;
      padding: 12px 16px;
      border-left: 5px solid #d9534f;
      background: #fdeaea;
      color: #8a1f1b;
      border-radius: 4px;
    }
    .result {
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      background: #0d1117;
    }
    .result-header {
      background: #1c3a6b;
      color: #ffffff;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 1rem;
    }
    pre {
      margin: 0;
      padding: 18px;
      background: #0d1117;
      color: #e6e6e6;
      font-family: Consolas, "Courier New", monospace;
      font-size: .85rem;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre;
    }
    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Router Automation Dashboard</h1>
    <p class="target">Target: <code>{{ target }}</code> (Telnet)</p>

    <form method="POST" id="diag-form">
      <button type="submit" class="run" id="run-btn">Run Diagnostics</button>
      <span class="status" id="status"></span>
    </form>

    {% if error %}
      <div class="alert"><strong>Error:</strong> {{ error }}</div>
    {% endif %}

    {% if results %}
      <h2>Execution Results</h2>
      {% for cmd, output in results.items() %}
        <div class="result">
          <div class="result-header">Command: {{ cmd }}</div>
          <pre>{{ output }}</pre>
        </div>
      {% endfor %}
    {% endif %}
  </div>

  <script>
    const form = document.getElementById('diag-form');
    const btn = document.getElementById('run-btn');
    const status = document.getElementById('status');

    form.addEventListener('submit', () => {
      btn.disabled = true;
      btn.textContent = 'Running...';
      status.textContent = 'Connecting to router...';
    });
  </script>
</body>
</html>
